server_tokens off;
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
gzip_min_length 256;
gzip_vary on;
server {
    listen 80;
    server_name fengvoice.top www.fengvoice.top localhost;
    return 301 https://$server_name$request_uri;
}
server {
    listen 443 ssl http2;
    server_name fengvoice.top www.fengvoice.top localhost;
    root /usr/share/nginx/html;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/fengvoice.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fengvoice.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location ~ /\. { return 404; }
    location = /ai-photo {
        return 301 /ai-photo/;
    }
    location /ai-photo/ {
        proxy_pass http://172.19.0.1:3200/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10m;
    }    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://prajna-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }
    location /ws/ {
        proxy_pass http://prajna-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}