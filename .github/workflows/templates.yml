name: Template Validation

on:
  push:
    paths:
      - 'templates/**'
      - 'scripts/validate_templates.py'
  pull_request:
    paths:
      - 'templates/**'
      - 'scripts/validate_templates.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_templates.py
